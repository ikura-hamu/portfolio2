            - heading "ぱそかた以外" [level=2] [ref=f2e197]
            - heading "東京ディズニーシー" [level=3] [ref=f2e198]
            - paragraph [ref=f2e199]: サークルの同期とディズニーシーに行った。ディズニーランドには中学の修学旅行とかで3回来たことがあったが、シーは初だった。新エリアがあったが、自分的には全て新エリアだったのでとても楽しめた。ソアリンというアトラクションとアナ雪のやつがお気に入りになった。
            - paragraph [ref=f2e200]:
              - img "夜ディズニーシー" [ref=f2e201]
            - heading "草津" [level=3] [ref=f2e202]
            - paragraph [ref=f2e203]: traPの合宿で草津に行った。スキーをしたり温泉に行ったりした。夜に宴会場でボードゲームをしたのが楽しかった。
            - paragraph [ref=f2e204]:
              - img "湯畑" [ref=f2e205]
            - paragraph [ref=f2e206]: これは湯畑。このブログのサムネイルはスキー場のてっぺん。
            - heading "帰省" [level=3] [ref=f2e207]
            - paragraph [ref=f2e208]: 実家に帰省した。安心した。帰省中には湖に野鳥を見に行った。Jリーグの試合も2試合観に行ったが、どっちも引き分けだった。
            - paragraph [ref=f2e209]:
              - img "野鳥" [ref=f2e210]
            - heading "伊東" [level=3] [ref=f2e211]
            - paragraph [ref=f2e212]: サークルの同期と伊東に行った。バーベキューした。ピザ窯で焼いたピザが美味しかった。シャボテン公園にも行った。サボテンの公園かと思ったら動物がその辺にたくさんいてびっくりした。とても満足した。
            - paragraph [ref=f2e213]:
              - img "シャボテン公園にいたシロクジャク" [ref=f2e214]
            - paragraph [ref=f2e215]: これはシャボテン公園にいたシロクジャク。とても近くにいたし人間を怖がるそぶりも無かったのですごかった。
            - heading "研究" [level=3] [ref=f2e216]
            - paragraph [ref=f2e217]: 情報通信系は3年の4Qから研究室に仮配属されるので、研究が始まっている。内容はぱそかたと言えばぱそかただが、ぱそかたが本質ではないのでこっちに書いた。「〇〇(任意)の研究をやってます」って名乗るのかっこいいと思っていたので、できるようになって嬉しい。
            - heading "今後" [level=2] [ref=f2e218]
            - paragraph [ref=f2e219]: 4年生になるので、授業はほぼ無い。研究をそれなりに頑張りたい。絶賛就活中なので、早く決まってほしい。就活がうまくいったら大学生活はあと1年なので、やった方がいいことをちゃんとやりたい。traP も技術的な面でなんか貢献したい。
            - paragraph [ref=f2e220]:
              - img "桜" [ref=f2e221]
            - paragraph [ref=f2e222]: 大岡山の桜満開。
