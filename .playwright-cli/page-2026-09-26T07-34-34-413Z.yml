            - heading "CPCTF" [level=3] [ref=f2e191]
            - paragraph [ref=f2e192]: CPCTFは、traPが毎年春にやってる競プロとCTFの大会。今年もインフラ担当としていろいろやってる。2年目の経験を活かしていろんな作業の自動化を進めている。去年は競技終了直前にサーバーを落とすというスーパーミスをしたので、今年は絶対落とさないようにしたい。参加待ってます。
